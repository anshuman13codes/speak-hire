<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Speak-Hire</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #0b1120; color: #e2e8f0; font-family: Arial, sans-serif; }
        .card { width: min(100%, 420px); padding: 40px; border: 1px solid #263449; border-radius: 20px; background: #111b2d; text-align: center; box-shadow: 0 24px 70px #0005; }
        .icon { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 20px; border-radius: 16px; background: #22c55e; color: #052e16; font-size: 28px; }
        h1 { margin: 0 0 10px; font-size: 28px; }
        p { color: #94a3b8; line-height: 1.6; }
        .google { display: flex; justify-content: center; align-items: center; gap: 12px; width: 100%; margin-top: 28px; padding: 14px; border: 0; border-radius: 10px; background: #fff; color: #1f2937; font-weight: 700; font-size: 15px; text-decoration: none; transition: background .2s; }
        .google:hover { background: #e2e8f0; }
        .google-mark { font-size: 19px; font-weight: 700; color: #4285f4; }
        .note { margin: 18px 0 0; font-size: 13px; }
        .error { margin-top: 20px; padding: 12px; border: 1px solid #7f1d1d; border-radius: 8px; background: #450a0a; color: #fecaca; font-size: 14px; }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon" aria-hidden="true">🎯</div>
        <h1>Welcome to Speak-Hire</h1>
        <p>Sign in to practice interviews, get AI feedback, and build confidence for your next opportunity.</p>
        {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
        <a class="google" href="{{ url_for('google_login') }}">
            <span class="google-mark" aria-hidden="true">G</span>
            Continue with Google
        </a>
        <p class="note">Use your verified Gmail account to continue.</p>
    </main>
</body>
</html>
