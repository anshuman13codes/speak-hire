<!DOCTYPE html>
<html>
<head>
    <title>Speak-Hire | Practice</title>
    <style>
        body { font-family: Arial; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 15px; width: 400px; text-align: center; }
        input { width: 90%; padding: 12px; margin: 15px 0; border-radius: 8px; border: none; }
        button { background: #00ff88; color: black; padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .account { position: fixed; top: 20px; right: 24px; color: #cbd5e1; font-size: 14px; }
        .account a { color: #22c55e; margin-left: 12px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="account">{{ session.user.name }} · <a href="{{ url_for('logout') }}">Sign out</a></div>
    <div class="box">
        <h2>🎯 Speak-Hire</h2>
        <p>Paste the job role you want</p>
        <form method="POST">
            <input type="text" name="role" placeholder="e.g. Python Developer, Java Intern, TCS" required>
            <button type="submit">Generate Interview →</button>
        </form>
    </div>
</body>
</html>
